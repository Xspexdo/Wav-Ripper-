name: Build and Release WAV Ripper

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Executable
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --icon "logo.ico" --add-data "logo_rounded.png;." --add-data "logo.ico;." --collect-all customtkinter --exclude-module numpy --exclude-module scipy --exclude-module matplotlib --exclude-module pandas --name "WAV-Ripper" wav_hud.pyw
          Compress-Archive -Path dist/WAV-Ripper.exe -DestinationPath dist/WAV-Ripper-Windows.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/WAV-Ripper.exe
            dist/WAV-Ripper-Windows.zip
          name: "WAV Ripper ${{ github.ref_name }}"
          generate_release_notes: true
